# Weekly full regeneration of bitcoin-power-law/assets/{data.js, fig_*.png}
# via the in-repo pipeline (scripts/powerlaw_pipeline/): fetch candles, refit
# the power law, rerun every econometric lens, redraw the figures.
#
# The daily update-btc-price job keeps patching only the "current" price block
# in between these weekly refits. Deliberately a SEPARATE concurrency group:
# update-btc-price uses cancel-in-progress, which would kill a minutes-long
# regen if the groups were shared.
name: Refresh power-law analysis

on:
  schedule:
    - cron: '47 10 * * 1'   # Mondays 10:47 UTC, well clear of the daily 07:23 price job
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-power-law
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/powerlaw_pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/powerlaw_pipeline/requirements.txt

      # Candle parquet cache; a cold miss just means a ~256-request backfill
      # (a couple of minutes), so eviction is self-healing.
      - name: Restore candle cache
        uses: actions/cache@v4
        with:
          path: .cache/candles
          key: candles-BTC-USD-ONE_HOUR-v1-${{ github.run_id }}
          restore-keys: |
            candles-BTC-USD-ONE_HOUR-v1-

      - name: Refresh hourly candles
        run: python scripts/powerlaw_pipeline/fetch_candles.py

      - name: Fit + corridor
        run: python scripts/powerlaw_pipeline/power_law.py

      - name: Econometric lenses
        run: python scripts/powerlaw_pipeline/pl_econometrics.py

      - name: Figures
        run: python scripts/powerlaw_pipeline/pl_figures.py

      - name: Bundle data.js
        run: python scripts/powerlaw_pipeline/pl_data.py

      - name: Verify output
        run: python scripts/powerlaw_pipeline/verify_data.py

      - name: Daily-patch compatibility smoke test
        run: BTC_TEST_PRICE=100000 python scripts/update_btc_price.py --dry-run

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bitcoin-power-law/assets/data.js bitcoin-power-law/assets/fig_*.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: weekly power-law regeneration [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
