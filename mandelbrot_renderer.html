<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandelbrot Explorer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="mandelbrot"></canvas>

  <script>
    const canvas = document.getElementById('mandelbrot');
    const ctx = canvas.getContext('2d');

    // Adjust canvas resolution for HiDPI displays.
    function setCanvasResolution() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    // Global boundaries of the complex plane.
    let xmin = -2.5, xmax = 1;
    let ymin = -1, ymax = 1;
    const maxIter = 200;

    // Optimized HSL to RGB conversion.
    function hslToRgb(h, s, l) {
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const hp = Math.floor(h / 60);
      const x = c * (1 - Math.abs((h / 60) - hp - 0.5) * 2);
      let r = 0, g = 0, b = 0;
      switch (hp) {
        case 0: r = c; g = x; b = 0; break;
        case 1: r = x; g = c; b = 0; break;
        case 2: r = 0; g = c; b = x; break;
        case 3: r = 0; g = x; b = c; break;
        case 4: r = x; g = 0; b = c; break;
        case 5: r = c; g = 0; b = x; break;
        default: r = 0; g = 0; b = 0; break;
      }
      const m = l - c / 2;
      return [
        (r + m) * 255 | 0,
        (g + m) * 255 | 0,
        (b + m) * 255 | 0
      ];
    }

    // Draw the Mandelbrot set. We clear the canvas at the start so that each call is a fresh render.
    function drawMandelbrot() {
      // Clear the canvas completely.
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);
      const imgData = ctx.createImageData(width, height);
      const data = imgData.data;
      
      // Precompute step sizes and constants.
      const dx = (xmax - xmin) / width;
      const dy = (ymax - ymin) / height;
      const log2 = Math.log(2);
      const escapeRadiusSq = 4;
      
      let pixelIndex = 0;
      for (let j = 0; j < height; j++) {
        const cy = ymin + j * dy;
        for (let i = 0; i < width; i++) {
          const cx = xmin + i * dx;
          let zx = 0, zy = 0, iter = 0;
          
          // Mandelbrot iteration.
          while (zx*zx + zy*zy < escapeRadiusSq && iter < maxIter) {
            const temp = zx*zx - zy*zy + cx;
            zy = 2 * zx * zy + cy;
            zx = temp;
            iter++;
          }
          
          if (iter === maxIter) {
            data[pixelIndex++] = 0;
            data[pixelIndex++] = 0;
            data[pixelIndex++] = 0;
            data[pixelIndex++] = 255;
          } else {
            const mag = Math.sqrt(zx*zx + zy*zy);
            const smoothIter = iter + 1 - Math.log(Math.log(mag)) / log2;
            const hue = (smoothIter / maxIter) * 360;
            const rgb = hslToRgb(hue, 1, 0.5);
            data[pixelIndex++] = rgb[0];
            data[pixelIndex++] = rgb[1];
            data[pixelIndex++] = rgb[2];
            data[pixelIndex++] = 255;
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // Resize handler: adjust resolution and redraw.
    function resize() {
      setCanvasResolution();
      drawMandelbrot();
    }
    window.addEventListener('resize', resize);
    resize();

    // Left-click: Zoom in and trigger a fresh render.
    canvas.addEventListener('click', function(event) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const w = rect.width, h = rect.height;
      const clickReal = xmin + (x / w) * (xmax - xmin);
      const clickImag = ymin + (y / h) * (ymax - ymin);
      const zoomFactor = 0.5;
      const newWidth = (xmax - xmin) * zoomFactor;
      const newHeight = (ymax - ymin) * zoomFactor;
      xmin = clickReal - newWidth / 2;
      xmax = clickReal + newWidth / 2;
      ymin = clickImag - newHeight / 2;
      ymax = clickImag + newHeight / 2;
      drawMandelbrot();
    });

    // Right-click: Zoom out and trigger a fresh render.
    canvas.addEventListener('contextmenu', function(event) {
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const w = rect.width, h = rect.height;
      const clickReal = xmin + (x / w) * (xmax - xmin);
      const clickImag = ymin + (y / h) * (ymax - ymin);
      const zoomFactor = 2.0;
      const newWidth = (xmax - xmin) * zoomFactor;
      const newHeight = (ymax - ymin) * zoomFactor;
      xmin = clickReal - newWidth / 2;
      xmax = clickReal + newWidth / 2;
      ymin = clickImag - newHeight / 2;
      ymax = clickImag + newHeight / 2;
      drawMandelbrot();
      return false;
    });
  </script>
</body>
</html>
