<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandelbrot Explorer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas { 
      display: block; 
    }
  </style>
</head>
<body>
  <canvas id="mandelbrotCanvas"></canvas>
  <script>
    // Define the worker code as a string.
    var workerScript = `
      self.onmessage = function (event) {
          var data = event.data;
          var c_i = data.i;
          var max_iter = data.max_iter;
          var escape = data.escape * data.escape;
          data.values = [];
          for (var i = 0; i < data.width; i++) {
              var c_r = data.r_min + (data.r_max - data.r_min) * i / data.width;
              var z_r = 0, z_i = 0;
              var iter;
              for (iter = 0; z_r*z_r + z_i*z_i < escape && iter < max_iter; iter++) {
                  // Compute z -> z^2 + c
                  var tmp = z_r*z_r - z_i*z_i + c_r;
                  z_i = 2 * z_r * z_i + c_i;
                  z_r = tmp;
              }
              if (iter == max_iter) {
                  iter = -1;
              }
              data.values.push(iter);
          }
          self.postMessage(data);
      }
    `;
    // Create a Blob URL for the worker code.
    var blob = new Blob([workerScript], { type: "application/javascript" });
    var workerURL = URL.createObjectURL(blob);

    // Define the Mandelbrot viewer class.
    var Mandelbrot = function (canvas, n_workers) {
      var self = this;
      this.canvas = canvas;
      this.ctx = canvas.getContext("2d");
      this.row_data = this.ctx.createImageData(canvas.width, 1);
      this.canvas.addEventListener("click", function(event) {
          var rect = canvas.getBoundingClientRect();
          var x = (event.clientX - rect.left) * (canvas.width  / rect.width);
          var y = (event.clientY - rect.top)  * (canvas.height / rect.height);
          self.click(x, y);
      }, false);
      this.canvas.addEventListener("contextmenu", function(event) {
          event.preventDefault();
          var rect = canvas.getBoundingClientRect();
          var x = (event.clientX - rect.left) * (canvas.width  / rect.width);
          var y = (event.clientY - rect.top)  * (canvas.height / rect.height);
          self.zoom_out(x, y);
          return false;
      }, false);
      window.addEventListener("resize", function() {
          self.resize_to_parent();
      }, false);

      // Create workers using the Blob URL.
      this.workers = [];
      for (var i = 0; i < n_workers; i++) {
          var worker = new Worker(workerURL);
          worker.onmessage = function(event) {
              self.received_row(event.target, event.data);
          }
          worker.idle = true;
          this.workers.push(worker);
      }

      // Set up initial Mandelbrot parameters.
      this.i_max = 1.5;
      this.i_min = -1.5;
      this.r_min = -2.5;
      this.r_max = 1.5;
      this.max_iter = 1024;
      this.escape = 100;
      this.generation = 0;
      this.nextrow = 0;
      this.make_palette();
    };

    Mandelbrot.prototype = {
      make_palette: function() {
          this.palette = [];
          // A helper to wrap values to a sawtooth pattern.
          function wrap(x) {
              x = ((x + 256) & 0x1ff) - 256;
              if (x < 0) x = -x;
              return x;
          }
          for (var i = 0; i <= this.max_iter; i++) {
              this.palette.push([wrap(7*i), wrap(5*i), wrap(11*i)]);
          }
      },

      draw_row: function(data) {
          var values = data.values;
          var pdata = this.row_data.data;
          for (var i = 0; i < this.row_data.width; i++) {
              pdata[4*i+3] = 255;
              if (values[i] < 0) {
                  pdata[4*i] = pdata[4*i+1] = pdata[4*i+2] = 0;
              } else {
                  var colour = this.palette[values[i]];
                  pdata[4*i]   = colour[0];
                  pdata[4*i+1] = colour[1];
                  pdata[4*i+2] = colour[2];
              }
          }
          this.ctx.putImageData(this.row_data, 0, data.row);
      },

      received_row: function(worker, data) {
          if (data.generation === this.generation) {
              this.draw_row(data);
          }
          this.process_row(worker);
      },

      process_row: function(worker) {
          var row = this.nextrow++;
          if (row >= this.canvas.height) {
              worker.idle = true;
          } else {
              worker.idle = false;
              worker.postMessage({
                  row: row,
                  width: this.row_data.width,
                  generation: this.generation,
                  r_min: this.r_min,
                  r_max: this.r_max,
                  i: this.i_max + (this.i_min - this.i_max) * row / this.canvas.height,
                  max_iter: this.max_iter,
                  escape: this.escape,
              });
          }
      },

      redraw: function() {
          this.generation++;
          this.nextrow = 0;
          for (var i = 0; i < this.workers.length; i++) {
              var worker = this.workers[i];
              if (worker.idle)
                  this.process_row(worker);
          }
      },

      click: function(x, y) {
          var width = this.r_max - this.r_min;
          var height = this.i_min - this.i_max;
          var click_r = this.r_min + width * x / this.canvas.width;
          var click_i = this.i_max + height * y / this.canvas.height;

          this.r_min = click_r - width/8;
          this.r_max = click_r + width/8;
          this.i_max = click_i - height/8;
          this.i_min = click_i + height/8;
          this.redraw();
      },

      zoom_out: function(x, y) {
          var width = this.r_max - this.r_min;
          var height = this.i_min - this.i_max;
          var click_r = this.r_min + width * x / this.canvas.width;
          var click_i = this.i_max + height * y / this.canvas.height;

          // Inverse of click(): expand the viewport 4x around the right-click point.
          this.r_min = click_r - width*2;
          this.r_max = click_r + width*2;
          this.i_max = click_i - height*2;
          this.i_min = click_i + height*2;
          this.redraw();
      },

      resize_to_parent: function() {
          var dpr = window.devicePixelRatio || 1;
          this.canvas.width  = Math.floor(window.innerWidth  * dpr);
          this.canvas.height = Math.floor(window.innerHeight * dpr);
          this.canvas.style.width  = window.innerWidth  + 'px';
          this.canvas.style.height = window.innerHeight + 'px';

          // Adjust horizontal scale to maintain aspect ratio.
          var width = ((this.i_max - this.i_min) *
                       this.canvas.width / this.canvas.height);
          var r_mid = (this.r_max + this.r_min) / 2;
          this.r_min = r_mid - width/2;
          this.r_max = r_mid + width/2;

          // Reallocate the row image data.
          this.row_data = this.ctx.createImageData(this.canvas.width, 1);
          this.redraw();
      },
    };

    // When the page loads, initialize the Mandelbrot viewer.
    window.onload = function() {
      var canvas = document.getElementById("mandelbrotCanvas");
      var dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width  = window.innerWidth  + 'px';
      canvas.style.height = window.innerHeight + 'px';
      var mandelbrot = new Mandelbrot(canvas, 4);
      mandelbrot.redraw();
    };
  </script>
</body>
</html>
