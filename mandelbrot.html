<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandelbrot Explorer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      touch-action: none;          /* taps are handled in JS; no browser pan/zoom */
      -webkit-touch-callout: none; /* no long-press callout on iOS */
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="mandelbrotCanvas"></canvas>
  <script>
    // Define the worker code as a string.
    //
    // Worker protocol (Mariani-Silver friendly):
    //   In:  { id, generation, coords: Int32Array [x0,y0, x1,y1, ...],
    //          r_min, r_max, i_min, i_max, canvas_w, canvas_h, max_iter, escape }
    //   Out: { id, generation, coords, values: Float32Array [v0, v1, ...] }
    //        v = smooth (fractional) iteration count, or -1 for in-set.
    // Both coords and values are transferable buffers (zero-copy hand-off).
    var workerScript = `
      self.onmessage = function (event) {
          var d = event.data;
          var width = d.canvas_w, height = d.canvas_h;
          var escape = d.escape * d.escape;
          var max_iter = d.max_iter;
          var n = d.coords.length / 2;
          var values = new Float32Array(n);
          for (var k = 0; k < n; k++) {
              var px = d.coords[2*k];
              var py = d.coords[2*k + 1];
              var c_r = d.r_min + (d.r_max - d.r_min) * px / width;
              var c_i = d.i_max + (d.i_min - d.i_max) * py / height;

              var v;
              // Cardioid + period-2 bulb early-out
              var cr_m = c_r - 0.25;
              var q = cr_m*cr_m + c_i*c_i;
              if (q * (q + cr_m) < 0.25 * c_i*c_i) {
                  v = -1;
              } else if ((c_r + 1)*(c_r + 1) + c_i*c_i < 0.0625) {
                  v = -1;
              } else {
                  var z_r = 0, z_i = 0, m = 0, iter = 0;
                  while (iter < max_iter) {
                      m = z_r*z_r + z_i*z_i;
                      if (m >= escape) break;
                      var tmp = z_r*z_r - z_i*z_i + c_r;
                      z_i = 2 * z_r * z_i + c_i;
                      z_r = tmp;
                      iter++;
                  }
                  if (iter >= max_iter) {
                      v = -1;
                  } else {
                      // Smooth (normalized) iteration count: subtracting
                      // log2(log|z|) at escape makes the value continuous
                      // across integer bands, so colors can interpolate.
                      v = iter + 1 - Math.log(Math.log(m) * 0.5) / Math.LN2;
                      if (v < 0) v = 0;
                  }
              }
              values[k] = v;
          }
          self.postMessage({
              id: d.id,
              generation: d.generation,
              coords: d.coords,
              values: values,
          }, [d.coords.buffer, values.buffer]);
      }
    `;
    // Create a Blob URL for the worker code.
    var blob = new Blob([workerScript], { type: "application/javascript" });
    var workerURL = URL.createObjectURL(blob);

    // ========================================================================
    // Mariani-Silver + Hilbert-ordered progressive renderer.
    //
    // Mariani-Silver observation: a rectangle whose border is uniform
    // tells us about its interior. Two cases now that coloring is smooth:
    //   - Border entirely in-set: the interior is in-set too (the set's
    //     complement is connected, so escaped points can't be sealed
    //     inside an all-in-set border). Flat-fill black and skip the
    //     interior — the most expensive pixels in the image.
    //   - Border entirely in one escape band: the interior is that band
    //     too, but smooth coloring renders bands as gradients rather than
    //     flat color, so the interior is computed directly. Cheap: the
    //     iteration count there is low and known in advance.
    // Rects with a mixed border subdivide into four quadrants and
    // recurse, down to MIN_RECT, below which interiors compute outright.
    //
    // Hilbert ordering: the work queue is sorted by the Hilbert index of
    // each rect's center. Rects whose centers are close on the 2D canvas
    // are also close in the queue, so the visual progression of updates
    // snakes across the canvas along a fractal space-filling curve
    // instead of row-by-row.
    //
    // Drawing: workers return pixel results into a single canvas-wide
    // backing ImageData. A requestAnimationFrame loop blits the backing
    // buffer once per display frame, amortizing the putImageData cost.
    // ========================================================================

    var Mandelbrot = function (canvas, n_workers) {
      var self = this;
      this.canvas = canvas;
      this.ctx = canvas.getContext("2d");

      // Mariani-Silver tuning
      this.MIN_RECT  = 16;   // below this, compute interior directly (no further subdivision)
      this.INIT_TILE = 128;  // starting grid cell size; each is an independent MS root

      // Canvas-wide backing buffer — single allocation, rAF flushes to ctx
      this.backing = this.ctx.createImageData(canvas.width, canvas.height);
      this.dirty = false;

      // Work state
      this.work_queue = [];          // sorted ascending by Hilbert index of rect center
      this.pending = new Map();      // id -> {rect, type, generation}
      this.next_id = 0;
      this.generation = 0;
      this.hilbert_n = 1;
      this.update_hilbert_n();

      // Event listeners
      this.canvas.addEventListener("click", function(event) {
          var rect = canvas.getBoundingClientRect();
          var x = (event.clientX - rect.left) * (canvas.width  / rect.width);
          var y = (event.clientY - rect.top)  * (canvas.height / rect.height);
          self.click(x, y);
      }, false);
      this.canvas.addEventListener("contextmenu", function(event) {
          event.preventDefault();
          var rect = canvas.getBoundingClientRect();
          var x = (event.clientX - rect.left) * (canvas.width  / rect.width);
          var y = (event.clientY - rect.top)  * (canvas.height / rect.height);
          self.zoom_out(x, y);
          return false;
      }, false);

      // Touch controls: one-finger tap zooms in (like click); two-finger
      // tap zooms out (the touch stand-in for right-click). preventDefault
      // suppresses the browser's synthetic click and double-tap zoom, so
      // taps are handled here and only here.
      var gesture = null;
      var touch_xy = function(t) {
          var rect = canvas.getBoundingClientRect();
          return {
              x: (t.clientX - rect.left) * (canvas.width  / rect.width),
              y: (t.clientY - rect.top)  * (canvas.height / rect.height),
          };
      };
      this.canvas.addEventListener("touchstart", function(event) {
          event.preventDefault();
          if (gesture === null) {
              gesture = {t0: Date.now(), max_fingers: 0, moved: false, start: {}};
          }
          for (var i = 0; i < event.changedTouches.length; i++) {
              var t = event.changedTouches[i];
              gesture.start[t.identifier] = touch_xy(t);
          }
          gesture.max_fingers = Math.max(gesture.max_fingers, event.touches.length);
      }, {passive: false});
      this.canvas.addEventListener("touchmove", function(event) {
          event.preventDefault();
          if (gesture === null) return;
          var slop = 12 * (window.devicePixelRatio || 1);
          for (var i = 0; i < event.changedTouches.length; i++) {
              var t = event.changedTouches[i];
              var s = gesture.start[t.identifier];
              if (!s) continue;
              var p = touch_xy(t);
              if (Math.abs(p.x - s.x) > slop || Math.abs(p.y - s.y) > slop) {
                  gesture.moved = true;
              }
          }
      }, {passive: false});
      this.canvas.addEventListener("touchend", function(event) {
          event.preventDefault();
          if (gesture === null || event.touches.length > 0) return;
          var g = gesture;
          gesture = null;
          if (g.moved || Date.now() - g.t0 > 350) return;
          var pts = [];
          for (var id in g.start) pts.push(g.start[id]);
          if (g.max_fingers === 1 && pts.length === 1) {
              self.click(pts[0].x, pts[0].y);
          } else if (g.max_fingers === 2 && pts.length === 2) {
              self.zoom_out((pts[0].x + pts[1].x) / 2,
                            (pts[0].y + pts[1].y) / 2);
          }
      }, {passive: false});
      this.canvas.addEventListener("touchcancel", function(event) {
          gesture = null;
      }, {passive: false});

      // Re-render on resize/rotation, debounced so a window drag doesn't
      // thrash full recomputes on every intermediate size.
      var resize_timer = null;
      window.addEventListener("resize", function() {
          clearTimeout(resize_timer);
          resize_timer = setTimeout(function() { self.resize_to_parent(); }, 150);
      }, false);

      // Worker pool
      this.workers = [];
      for (var i = 0; i < n_workers; i++) {
          var worker = new Worker(workerURL);
          worker.onmessage = function(event) {
              self.received(event.target, event.data);
          };
          worker.idle = true;
          this.workers.push(worker);
      }

      // Mandelbrot parameters
      this.max_iter = 256;
      this.escape = 100;
      this.fit_default_view();
      this.make_palette();

      // rAF loop — flush the backing buffer to the canvas once per frame
      var tick = function() {
          if (self.dirty) {
              self.ctx.putImageData(self.backing, 0, 0);
              self.dirty = false;
          }
          requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };

    Mandelbrot.prototype = {
      make_palette: function() {
          this.palette = [];
          function wrap(x) {
              x = ((x + 256) & 0x1ff) - 256;
              if (x < 0) x = -x;
              return x;
          }
          for (var i = 0; i <= this.max_iter; i++) {
              this.palette.push([wrap(7*i), wrap(5*i), wrap(11*i)]);
          }
      },

      // ------------------------------------------------------------
      // Hilbert curve: pixel (x,y) -> index along a 2^k x 2^k curve
      // that covers the smallest power-of-2 square containing the canvas.
      // Adapted from the standard d2xy inverse (Wikipedia: Hilbert curve).
      // ------------------------------------------------------------
      update_hilbert_n: function() {
          var max_dim = Math.max(this.canvas.width, this.canvas.height);
          var n = 1;
          while (n < max_dim) n *= 2;
          this.hilbert_n = n;
      },

      hilbert_index: function(x, y) {
          var n = this.hilbert_n;
          var rx, ry, d = 0;
          var ix = Math.floor(x) | 0;
          var iy = Math.floor(y) | 0;
          for (var s = n >>> 1; s > 0; s >>>= 1) {
              rx = (ix & s) > 0 ? 1 : 0;
              ry = (iy & s) > 0 ? 1 : 0;
              d += s * s * ((3 * rx) ^ ry);
              if (ry === 0) {
                  if (rx === 1) {
                      ix = s - 1 - ix;
                      iy = s - 1 - iy;
                  }
                  var t = ix; ix = iy; iy = t;
              }
          }
          return d;
      },

      // ------------------------------------------------------------
      // Work queue: binary-search insertion keeps it sorted by Hilbert
      // index so dispatch_next pulls from the Hilbert-front.
      // ------------------------------------------------------------
      enqueue: function(type, rect, iter_hint) {
          var cx = rect.x + rect.w / 2;
          var cy = rect.y + rect.h / 2;
          var h_index = this.hilbert_index(cx, cy);
          var item = {type: type, rect: rect, hilbert: h_index, iter_hint: iter_hint};
          var lo = 0, hi = this.work_queue.length;
          while (lo < hi) {
              var mid = (lo + hi) >>> 1;
              if (this.work_queue[mid].hilbert < h_index) lo = mid + 1;
              else hi = mid;
          }
          this.work_queue.splice(lo, 0, item);
      },

      // ------------------------------------------------------------
      // Rect geometry helpers
      // ------------------------------------------------------------
      border_coords: function(rect) {
          // Interleaved [x0,y0, x1,y1, ...] along the rect's 1-pixel perimeter.
          var x0 = rect.x, y0 = rect.y;
          var x1 = rect.x + rect.w - 1, y1 = rect.y + rect.h - 1;
          var count;
          if (rect.h === 1) {
              count = rect.w;
          } else if (rect.w === 1) {
              count = rect.h;
          } else {
              count = 2 * rect.w + 2 * (rect.h - 2);
          }
          var coords = new Int32Array(count * 2);
          var k = 0;
          // Top edge
          for (var x = x0; x <= x1; x++) { coords[k++] = x; coords[k++] = y0; }
          if (rect.h > 1) {
              // Bottom edge
              for (var x2 = x0; x2 <= x1; x2++) { coords[k++] = x2; coords[k++] = y1; }
              // Left edge (excluding corners)
              for (var y = y0 + 1; y < y1; y++) { coords[k++] = x0; coords[k++] = y; }
              // Right edge (excluding corners)
              if (rect.w > 1) {
                  for (var y2 = y0 + 1; y2 < y1; y2++) { coords[k++] = x1; coords[k++] = y2; }
              }
          }
          return coords;
      },

      solid_coords: function(rect) {
          // All pixels in rect, row-major. Used only for leaf rects (≤ MIN_RECT).
          var n = rect.w * rect.h;
          var coords = new Int32Array(n * 2);
          var k = 0;
          for (var y = rect.y; y < rect.y + rect.h; y++) {
              for (var x = rect.x; x < rect.x + rect.w; x++) {
                  coords[k++] = x;
                  coords[k++] = y;
              }
          }
          return coords;
      },

      subdivide: function(rect) {
          var w1 = Math.floor(rect.w / 2);
          var h1 = Math.floor(rect.h / 2);
          var w2 = rect.w - w1;
          var h2 = rect.h - h1;
          var out = [];
          if (w1 > 0 && h1 > 0) out.push({x: rect.x,      y: rect.y,      w: w1, h: h1});
          if (w2 > 0 && h1 > 0) out.push({x: rect.x + w1, y: rect.y,      w: w2, h: h1});
          if (w1 > 0 && h2 > 0) out.push({x: rect.x,      y: rect.y + h1, w: w1, h: h2});
          if (w2 > 0 && h2 > 0) out.push({x: rect.x + w1, y: rect.y + h1, w: w2, h: h2});
          return out;
      },

      inner_rect: function(rect) {
          if (rect.w <= 2 || rect.h <= 2) return null;
          return {x: rect.x + 1, y: rect.y + 1, w: rect.w - 2, h: rect.h - 2};
      },

      // ------------------------------------------------------------
      // Backing-buffer drawing — all writes hit `this.backing`, which
      // the rAF tick blits to the canvas at display rate.
      // ------------------------------------------------------------
      shade: function(v) {
          // Map a smooth iteration count to a color by interpolating
          // between adjacent palette entries; -1 (in-set) is black.
          if (v < 0) return [0, 0, 0];
          var i0 = v | 0;
          if (i0 >= this.max_iter) i0 = this.max_iter - 1;
          var f = v - i0;
          var c0 = this.palette[i0], c1 = this.palette[i0 + 1];
          return [
              (c0[0] + (c1[0] - c0[0]) * f) | 0,
              (c0[1] + (c1[1] - c0[1]) * f) | 0,
              (c0[2] + (c1[2] - c0[2]) * f) | 0,
          ];
      },

      draw_pixels: function(coords, values) {
          var data = this.backing.data;
          var w = this.canvas.width;
          var pal = this.palette;
          var last = this.max_iter - 1;
          for (var k = 0; k < values.length; k++) {
              var px = coords[2*k];
              var py = coords[2*k + 1];
              var v = values[k];
              var r, g, b;
              if (v < 0) {
                  r = 0; g = 0; b = 0;
              } else {
                  // shade(), inlined to avoid an array allocation per pixel
                  var i0 = v | 0;
                  if (i0 > last) i0 = last;
                  var f = v - i0;
                  var c0 = pal[i0], c1 = pal[i0 + 1];
                  r = (c0[0] + (c1[0] - c0[0]) * f) | 0;
                  g = (c0[1] + (c1[1] - c0[1]) * f) | 0;
                  b = (c0[2] + (c1[2] - c0[2]) * f) | 0;
              }
              var idx = 4 * (py * w + px);
              data[idx]     = r;
              data[idx + 1] = g;
              data[idx + 2] = b;
              data[idx + 3] = 255;
          }
          this.dirty = true;
      },

      fill_rect: function(rect, iter) {
          var rgb = this.shade(iter);
          var r = rgb[0], g = rgb[1], b = rgb[2];
          var data = this.backing.data;
          var w = this.canvas.width;
          var y_end = rect.y + rect.h;
          var x_end = rect.x + rect.w;
          for (var y = rect.y; y < y_end; y++) {
              var row_base = 4 * (y * w + rect.x);
              for (var x = rect.x; x < x_end; x++) {
                  data[row_base]     = r;
                  data[row_base + 1] = g;
                  data[row_base + 2] = b;
                  data[row_base + 3] = 255;
                  row_base += 4;
              }
          }
          this.dirty = true;
      },

      clear_backing: function() {
          var data = this.backing.data;
          for (var i = 0; i < data.length; i += 4) {
              data[i] = 0;
              data[i + 1] = 0;
              data[i + 2] = 0;
              data[i + 3] = 255;
          }
          this.dirty = true;
      },

      // ------------------------------------------------------------
      // Render pipeline
      // ------------------------------------------------------------
      redraw: function() {
          // Scale max_iter with zoom depth.
          var zoom_depth = Math.log2(4.0 / (this.r_max - this.r_min));
          var new_max_iter = Math.max(256, Math.round(256 + 100 * Math.max(0, zoom_depth)));
          if (new_max_iter !== this.max_iter) {
              this.max_iter = new_max_iter;
              this.make_palette();
          }

          // Reset state and invalidate any in-flight worker results.
          this.generation++;
          this.work_queue = [];
          this.pending.clear();
          this.clear_backing();

          // Seed: grid of INIT_TILE × INIT_TILE rects, each an independent
          // Mariani-Silver root. Starting from small tiles keeps the initial
          // border-compute phase short and lets Hilbert ordering take effect
          // immediately.
          for (var ty = 0; ty < this.canvas.height; ty += this.INIT_TILE) {
              for (var tx = 0; tx < this.canvas.width; tx += this.INIT_TILE) {
                  var rect = {
                      x: tx, y: ty,
                      w: Math.min(this.INIT_TILE, this.canvas.width  - tx),
                      h: Math.min(this.INIT_TILE, this.canvas.height - ty),
                  };
                  this.enqueue('border', rect);
              }
          }

          // Kick all idle workers
          for (var i = 0; i < this.workers.length; i++) {
              if (this.workers[i].idle) this.dispatch_next(this.workers[i]);
          }
      },

      dispatch_next: function(worker) {
          // Drain any interior fills (no worker needed) from the front of the queue.
          while (this.work_queue.length > 0 && this.work_queue[0].type === 'interior') {
              var item0 = this.work_queue.shift();
              this.fill_rect(item0.rect, item0.iter_hint);
          }
          if (this.work_queue.length === 0) {
              worker.idle = true;
              return;
          }
          var item = this.work_queue.shift();
          var id = this.next_id++;
          this.pending.set(id, {rect: item.rect, type: item.type, generation: this.generation});

          var coords;
          if (item.type === 'border') {
              coords = this.border_coords(item.rect);
          } else {
              coords = this.solid_coords(item.rect);
          }
          worker.idle = false;
          worker.postMessage({
              id: id,
              generation: this.generation,
              coords: coords,
              r_min: this.r_min, r_max: this.r_max,
              i_min: this.i_min, i_max: this.i_max,
              canvas_w: this.canvas.width,
              canvas_h: this.canvas.height,
              max_iter: this.max_iter,
              escape: this.escape,
          }, [coords.buffer]);
      },

      received: function(worker, data) {
          if (data.generation !== this.generation) {
              // Stale result — discard and keep the worker running.
              this.dispatch_next(worker);
              return;
          }
          var entry = this.pending.get(data.id);
          this.pending.delete(data.id);

          // Always draw what we computed.
          this.draw_pixels(data.coords, data.values);

          if (entry && entry.type === 'border') {
              // Classify the border: all in-set, all in one escape band,
              // or mixed.
              var all_in_set = true;
              var one_band = true;
              var first_band = Math.floor(data.values[0]);
              for (var i = 0; i < data.values.length; i++) {
                  var vi = data.values[i];
                  if (vi !== -1) all_in_set = false;
                  if (Math.floor(vi) !== first_band) one_band = false;
                  if (!all_in_set && !one_band) break;
              }
              var inner = this.inner_rect(entry.rect);
              if (all_in_set) {
                  // The set's complement is connected, so escaped points
                  // can't be sealed inside an all-in-set border: the
                  // interior is in-set too. Flat-fill black, skipping the
                  // most expensive pixels entirely.
                  if (inner) this.enqueue('interior', inner, -1);
              } else if (one_band || entry.rect.w <= this.MIN_RECT || entry.rect.h <= this.MIN_RECT) {
                  // Single escape band: the interior is the same band, but
                  // under smooth coloring a band is a gradient, not a flat
                  // color — compute it directly. These are the cheap pixels
                  // (low, already-known iteration count), and subdividing
                  // further could never flat-fill anything anyway.
                  // (Also the terminal case for rects too small to split.)
                  if (inner) this.enqueue('solid', inner);
              } else {
                  // Mixed border: subdivide into 4 quads and border-check each.
                  var quads = this.subdivide(entry.rect);
                  for (var q = 0; q < quads.length; q++) {
                      this.enqueue('border', quads[q]);
                  }
              }
          }

          this.dispatch_next(worker);
      },

      click: function(x, y) {
          var width = this.r_max - this.r_min;
          var height = this.i_min - this.i_max;
          var click_r = this.r_min + width * x / this.canvas.width;
          var click_i = this.i_max + height * y / this.canvas.height;

          // Depth floor: stop before a pixel shrinks to a few double-
          // precision ulps (~1e12x zoom), where the render would degrade
          // into blocky noise. The last click before the floor zooms
          // partially; clicks at the floor are ignored.
          var span_floor = this.canvas.width * 2e-15;
          var new_width = Math.max(width / 4, span_floor);
          if (new_width >= width) return;  // already bottomed out
          var f = new_width / width;

          this.r_min = click_r - width * f/2;
          this.r_max = click_r + width * f/2;
          this.i_max = click_i - height * f/2;
          this.i_min = click_i + height * f/2;
          this.at_default = false;
          this.redraw();
      },

      zoom_out: function(x, y) {
          var width = this.r_max - this.r_min;
          var height = this.i_min - this.i_max;
          var click_r = this.r_min + width * x / this.canvas.width;
          var click_i = this.i_max + height * y / this.canvas.height;

          // Inverse of click(): expand the viewport 4x around the right-click point.
          this.r_min = click_r - width*2;
          this.r_max = click_r + width*2;
          this.i_max = click_i - height*2;
          this.i_min = click_i + height*2;
          this.at_default = false;
          this.redraw();
      },

      fit_default_view: function() {
          // Pick the home view for this canvas aspect: landscape pins the
          // imaginary span, portrait pins the real span, so the whole set
          // (real [-2.0, 0.47], imag +-1.12) is in frame and undistorted
          // for any device orientation. At 4:3 this reproduces the classic
          // [-2.5, 1.5] x [-1.5, 1.5] framing.
          var a = this.canvas.width / this.canvas.height;
          var i_half = Math.max(1.5, 1.7 / a);
          var r_half = i_half * a;
          this.r_min = -0.5 - r_half;
          this.r_max = -0.5 + r_half;
          this.i_max = i_half;
          this.i_min = -i_half;
          this.at_default = true;
      },

      resize_to_parent: function() {
          var dpr = window.devicePixelRatio || 1;
          this.canvas.width  = Math.floor(window.innerWidth  * dpr);
          this.canvas.height = Math.floor(window.innerHeight * dpr);
          this.canvas.style.width  = window.innerWidth  + 'px';
          this.canvas.style.height = window.innerHeight + 'px';

          if (this.at_default) {
              // Not exploring yet — re-fit the home view to the new
              // aspect (e.g. a phone rotation).
              this.fit_default_view();
          } else {
              // Mid-exploration: keep the view centered by holding the
              // imaginary span and re-deriving the real span for the
              // new aspect ratio.
              var width = ((this.i_max - this.i_min) *
                           this.canvas.width / this.canvas.height);
              var r_mid = (this.r_max + this.r_min) / 2;
              this.r_min = r_mid - width/2;
              this.r_max = r_mid + width/2;
          }

          // Reallocate the backing buffer and recompute Hilbert grid size.
          this.backing = this.ctx.createImageData(this.canvas.width, this.canvas.height);
          this.update_hilbert_n();
          this.redraw();
      },
    };

    // When the page loads, initialize the Mandelbrot viewer.
    window.onload = function() {
      var canvas = document.getElementById("mandelbrotCanvas");
      var dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width  = window.innerWidth  + 'px';
      canvas.style.height = window.innerHeight + 'px';
      // One worker per core (capped); exposed on window for console tinkering.
      var n_workers = Math.min(navigator.hardwareConcurrency || 4, 16);
      window.mandelbrot = new Mandelbrot(canvas, n_workers);
      window.mandelbrot.redraw();
    };
  </script>
</body>
</html>
