<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Project Dashboard &mdash; Scott Nelson</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #f4f4f4; --card-bg: #fff; --text: #333; --muted: #6c757d;
      --q1: #dc3545; --q2: #0d6efd; --q3: #ffc107; --q4: #6c757d;
      --col-backlog: #e9ecef; --col-todo: #cfe2ff; --col-wip: #fff3cd; --col-done: #d1e7dd;
    }
    body { font-family: 'Open Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    h1,h2,h3,h4 { font-family: 'Montserrat', sans-serif; }
    .navbar { background-color: #343a40 !important; }

    /* Stats bar */
    .stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .stat-card {
      flex: 1; min-width: 120px; background: var(--card-bg); border-radius: 8px;
      padding: 12px 16px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .stat-card .num { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .stat-card .label { font-size: .75rem; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

    /* Controls */
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .view-btn.active { background: #0d6efd; color: #fff; }

    /* Kanban */
    .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; min-height: 400px; }
    .kanban-col {
      background: var(--col-backlog); border-radius: 8px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px; min-height: 200px;
    }
    .kanban-col:nth-child(2) { background: var(--col-todo); }
    .kanban-col:nth-child(3) { background: var(--col-wip); }
    .kanban-col:nth-child(4) { background: var(--col-done); }
    .kanban-col h5 { font-size: .85rem; text-transform: uppercase; margin: 0 0 6px; color: var(--muted); }

    /* Eisenhower */
    .eisenhower { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 12px; }
    .eq { border-radius: 8px; padding: 12px; min-height: 220px; }
    .eq h5 { font-size: .8rem; text-transform: uppercase; margin: 0 0 8px; }
    .eq-q1 { background: #f8d7da; } .eq-q1 h5 { color: var(--q1); }
    .eq-q2 { background: #cfe2ff; } .eq-q2 h5 { color: var(--q2); }
    .eq-q3 { background: #fff3cd; } .eq-q3 h5 { color: var(--q3); }
    .eq-q4 { background: #e9ecef; } .eq-q4 h5 { color: var(--q4); }
    .eq-axis-label {
      font-size: .7rem; text-transform: uppercase; color: var(--muted);
      text-align: center; font-weight: 600; letter-spacing: 1px;
    }

    /* Task cards */
    .task-card {
      background: var(--card-bg); border-radius: 6px; padding: 8px 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08); cursor: pointer; font-size: .82rem;
      border-left: 4px solid var(--muted); transition: box-shadow .15s;
    }
    .task-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .task-card .title { font-weight: 600; margin-bottom: 2px; }
    .task-card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .badge-project {
      font-size: .65rem; padding: 2px 6px; border-radius: 3px; color: #fff; font-weight: 600;
    }
    .badge-size {
      font-size: .65rem; padding: 1px 5px; border-radius: 3px;
      background: #e9ecef; color: #555;
    }
    .badge-epic {
      font-size: .65rem; padding: 1px 5px; border-radius: 3px;
      background: #f0f0f0; color: var(--muted);
    }

    /* Modal overrides */
    .modal-body select { max-width: 200px; }
    .detail-section { margin-top: 10px; }
    .detail-section dt { font-weight: 600; font-size: .8rem; color: var(--muted); }
    .detail-section dd { font-size: .85rem; margin-bottom: 8px; }

    /* Responsive */
    @media (max-width: 768px) {
      .kanban { grid-template-columns: 1fr; }
      .eisenhower { grid-template-columns: 1fr; }
    }

    /* Progress bar */
    .progress-row { margin-bottom: 1.5rem; }
    .progress { height: 10px; border-radius: 5px; }
  </style>
</head>

  // ============================================================
  // STATE
  // ============================================================
  const STORAGE_KEY = "dashboard_overrides_v1";
  let overrides = {};
  try { overrides = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) {}

  function getTask(t) {
    const o = overrides[t.id] || {};
    return { ...t, status: o.status || t.status, urgency: o.urgency || t.urgency, importance: o.importance || t.importance };
  }
  function saveOverride(id, field, value) {
    if (!overrides[id]) overrides[id] = {};
    overrides[id][field] = value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
  }

  function allTasks(filterProject, filterStatus, filterEpic) {
    const out = [];
    for (const p of PROJECTS) {
      if (filterProject !== "all" && p.name !== filterProject) continue;
      for (const t of p.tasks) {
        const merged = { ...getTask(t), project: p.name, projectColor: p.color };
        if (filterStatus !== "all" && merged.status !== filterStatus) continue;
        if (filterEpic !== "all" && merged.epic !== filterEpic) continue;
        out.push(merged);
      }
    }
    return out;
  }

  // ============================================================
  // RENDERING
  // ============================================================
  let currentView = "kanban";

  function renderCard(t) {
    const el = document.createElement("div");
    el.className = "task-card";
    el.style.borderLeftColor = t.projectColor;
    el.innerHTML = `
      <div class="title">${t.id}: ${t.title}</div>
      <div class="meta">
        <span class="badge-project" style="background:${t.projectColor}">${t.project}</span>
        <span class="badge-size">${t.size}</span>
        <span class="badge-epic">${t.epic}</span>
      </div>`;
    el.addEventListener("click", () => openModal(t));
    return el;
  }

  function renderKanban(tasks) {
    const cols = { backlog: [], todo: [], in_progress: [], done: [] };
    for (const t of tasks) cols[t.status]?.push(t);
    const labels = { backlog:"Backlog", todo:"To Do", in_progress:"In Progress", done:"Done" };
    const board = document.getElementById("board");
    board.innerHTML = "";
    const grid = document.createElement("div");
    grid.className = "kanban";
    for (const key of ["backlog","todo","in_progress","done"]) {
      const col = document.createElement("div");
      col.className = "kanban-col";
      col.innerHTML = `<h5>${labels[key]} (${cols[key].length})</h5>`;
      for (const t of cols[key]) col.appendChild(renderCard(t));
      grid.appendChild(col);
    }
    board.appendChild(grid);
  }

  function renderEisenhower(tasks) {
    const quads = { q1:[], q2:[], q3:[], q4:[] };
    for (const t of tasks) {
      if (t.status === "done") continue;
      const u = t.urgency === "high", i = t.importance === "high";
      if (u && i) quads.q1.push(t);
      else if (!u && i) quads.q2.push(t);
      else if (u && !i) quads.q3.push(t);
      else quads.q4.push(t);
    }
    const board = document.getElementById("board");
    board.innerHTML = `
      <div style="display:grid; grid-template-columns:40px 1fr 1fr; grid-template-rows:auto auto auto; gap:0;">
        <div></div>
        <div class="eq-axis-label" style="padding:6px;">Urgent</div>
        <div class="eq-axis-label" style="padding:6px;">Not Urgent</div>
        <div class="eq-axis-label" style="writing-mode:vertical-lr; transform:rotate(180deg); padding:6px;">Important</div>
        <div class="eq eq-q1" id="eq-q1"><h5><i class="fas fa-fire me-1"></i>Do First (${quads.q1.length})</h5></div>
        <div class="eq eq-q2" id="eq-q2"><h5><i class="fas fa-calendar-alt me-1"></i>Schedule (${quads.q2.length})</h5></div>
        <div class="eq-axis-label" style="writing-mode:vertical-lr; transform:rotate(180deg); padding:6px;">Less Important</div>
        <div class="eq eq-q3" id="eq-q3"><h5><i class="fas fa-user-friends me-1"></i>Delegate (${quads.q3.length})</h5></div>
        <div class="eq eq-q4" id="eq-q4"><h5><i class="fas fa-trash-alt me-1"></i>Eliminate / Defer (${quads.q4.length})</h5></div>
      </div>`;
    for (const [k,arr] of Object.entries(quads)) {
      const container = document.getElementById("eq-"+k);
      for (const t of arr) container.appendChild(renderCard(t));
    }
  }

  function renderStats(tasks) {
    const counts = { backlog:0, todo:0, in_progress:0, done:0 };
    for (const t of tasks) counts[t.status] = (counts[t.status]||0) + 1;
    const total = tasks.length;
    const pct = total ? Math.round(counts.done / total * 100) : 0;
    document.getElementById("stats-bar").innerHTML = `
      <div class="stat-card"><div class="num">${total}</div><div class="label">Total</div></div>
      <div class="stat-card"><div class="num" style="color:var(--q1)">${counts.in_progress}</div><div class="label">In Progress</div></div>
      <div class="stat-card"><div class="num" style="color:var(--q2)">${counts.todo}</div><div class="label">To Do</div></div>
      <div class="stat-card"><div class="num" style="color:var(--muted)">${counts.backlog}</div><div class="label">Backlog</div></div>
      <div class="stat-card"><div class="num" style="color:#198754">${counts.done}</div><div class="label">Done</div></div>
      <div class="stat-card"><div class="num" style="color:#198754">${pct}%</div><div class="label">Complete</div></div>`;
    document.getElementById("progress-row").innerHTML = `
      <div class="progress">
        <div class="progress-bar bg-success" style="width:${counts.done/total*100}%"></div>
        <div class="progress-bar bg-warning" style="width:${counts.in_progress/total*100}%"></div>
        <div class="progress-bar bg-primary" style="width:${counts.todo/total*100}%"></div>
      </div>`;
  }

  function render() {
    const fp = document.getElementById("filter-project").value;
    const fs = document.getElementById("filter-status").value;
    const fe = document.getElementById("filter-epic").value;
    const tasks = allTasks(fp, fs, fe);
    renderStats(tasks);
    if (currentView === "kanban") renderKanban(tasks);
    else renderEisenhower(tasks);
  }

  // ============================================================
  // MODAL
  // ============================================================
  let modalTask = null;
  function openModal(t) {
    modalTask = t;
    document.getElementById("modal-title").textContent = `${t.id}: ${t.title}`;
    document.getElementById("modal-body").innerHTML = `
      <div class="row g-3 mb-3">
        <div class="col-auto">
          <label class="form-label fw-bold" style="font-size:.8rem;">Status</label>
          <select class="form-select form-select-sm" id="m-status">
            <option value="backlog" ${t.status==="backlog"?"selected":""}>Backlog</option>
            <option value="todo" ${t.status==="todo"?"selected":""}>To Do</option>
            <option value="in_progress" ${t.status==="in_progress"?"selected":""}>In Progress</option>
            <option value="done" ${t.status==="done"?"selected":""}>Done</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label fw-bold" style="font-size:.8rem;">Urgency</label>
          <select class="form-select form-select-sm" id="m-urgency">
            <option value="low" ${t.urgency==="low"?"selected":""}>Low</option>
            <option value="high" ${t.urgency==="high"?"selected":""}>High</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label fw-bold" style="font-size:.8rem;">Importance</label>
          <select class="form-select form-select-sm" id="m-importance">
            <option value="low" ${t.importance==="low"?"selected":""}>Low</option>
            <option value="medium" ${t.importance==="medium"?"selected":""}>Medium</option>
            <option value="high" ${t.importance==="high"?"selected":""}>High</option>
          </select>
        </div>
      </div>
      <dl class="detail-section">
        <dt>Project</dt><dd><span class="badge-project" style="background:${t.projectColor}">${t.project}</span></dd>
        <dt>Epic</dt><dd>${t.epic}</dd>
        <dt>Size</dt><dd>${t.size === "S" ? "Small (~30 min)" : t.size === "M" ? "Medium (~1-2 hr)" : "Large (half day+)"}</dd>
        <dt>Acceptance Criteria</dt><dd>${t.acceptance || "—"}</dd>
        <dt>Dependencies</dt><dd>${t.deps && t.deps.length ? t.deps.join(", ") : "None"}</dd>
      </dl>`;
    new bootstrap.Modal(document.getElementById("taskModal")).show();
  }
  document.getElementById("modal-save").addEventListener("click", () => {
    if (!modalTask) return;
    saveOverride(modalTask.id, "status", document.getElementById("m-status").value);
    saveOverride(modalTask.id, "urgency", document.getElementById("m-urgency").value);
    saveOverride(modalTask.id, "importance", document.getElementById("m-importance").value);
    bootstrap.Modal.getInstance(document.getElementById("taskModal")).hide();
    render();
  });

  // ============================================================
  // INIT
  // ============================================================
  // Populate project filter
  const filterEl = document.getElementById("filter-project");
  for (const p of PROJECTS) {
    const opt = document.createElement("option");
    opt.value = p.name; opt.textContent = p.name;
    filterEl.appendChild(opt);
  }
  // Populate epic filter (unique across all projects, project-prefixed)
  const epicFilterEl = document.getElementById("filter-epic");
  const epicsByProject = {};
  for (const p of PROJECTS) {
    const seen = new Set();
    for (const t of p.tasks) {
      if (t.epic && !seen.has(t.epic)) { seen.add(t.epic); }
    }
    epicsByProject[p.name] = Array.from(seen).sort();
  }
  for (const p of PROJECTS) {
    if (!epicsByProject[p.name].length) continue;
    const group = document.createElement("optgroup");
    group.label = p.name;
    for (const epic of epicsByProject[p.name]) {
      const opt = document.createElement("option");
      opt.value = epic; opt.textContent = epic;
      group.appendChild(opt);
    }
    epicFilterEl.appendChild(group);
  }
  // View toggle
  document.querySelectorAll(".view-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentView = btn.dataset.view;
      render();
    });
  });
  // Filters
  document.getElementById("filter-project").addEventListener("change", render);
  document.getElementById("filter-status").addEventListener("change", render);
  document.getElementById("filter-epic").addEventListener("change", render);
  // Reset
  document.getElementById("btn-reset").addEventListener("click", () => {
    if (confirm("Reset all status/priority changes to defaults?")) {
      localStorage.removeItem(STORAGE_KEY);
      overrides = {};
      render();
    }
  });
  // Go
  render();
  </script>
</body>
</html>
