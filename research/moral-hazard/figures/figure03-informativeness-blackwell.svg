   <g id="text_14">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(256.71744 154.752707)">Given x, the likelihood ratio does not depend on s.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(256.71744 163.072707)">x is a sufficient statistic.  s can be ignored.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="13.06944" y="214.322209" transform="rotate(-0 13.06944 214.322209)">Each cell is the likelihood ratio f(x, s | a high) / f(x, s | a low).  Illustrative probabilities are in the caption.</text>
   </g>
