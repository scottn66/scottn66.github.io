    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e1e1e" x="5.76" y="12.598594" transform="rotate(-0 5.76 12.598594)">A.  When an extra signal belongs in the contract</text>
