   </g>
   <g id="text_26">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(280.116749 321.842746)">further noise,</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(274.300773 329.644523)">independent of a</text>
   </g>
   <g id="text_27">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(249.408 396.423275)">s_B is a garbling of s_A: it can be drawn from s_A by an extra layer of noise</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(249.408 404.34508)">that does not depend on the action.  Every expected-utility decision maker then</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(249.408 412.266884)">weakly prefers s_A to s_B (Blackwell 1953).  In the hidden-action problem, a principal</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(249.408 420.188689)">should not pay for s_B if s_A is already in the contract: s_B cannot tighten the</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(249.408 428.110494)">likelihood ratios given s_A.  The order is only partial; many real monitors are incomparable.</text>
   </g>
   <g id="text_28">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e1e1e" x="5.76" y="255.635938" transform="rotate(-0 5.76 255.635938)">B.  A Blackwell garbling</text>
   </g>
   <g id="text_29">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1e1e1e" transform="translate(43.413714 338.937931)">Hidden action</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1e1e1e" transform="translate(44.639918 347.382603)">(or the state)</text>
   </g>
   <g id="text_30">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1e1e1e" transform="translate(185.258483 338.11815)">Experiment  s_A</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1e1e1e" transform="translate(191.816733 347.101056)">(finer signal)</text>
   </g>
   <g id="text_31">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1e1e1e" transform="translate(365.550488 338.11815)">Experiment  s_B</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1e1e1e" transform="translate(366.449472 347.101056)">(garbled signal)</text>
   </g>
