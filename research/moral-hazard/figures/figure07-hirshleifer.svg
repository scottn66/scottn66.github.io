  <g id="text_22">
   <text style="font-size: 6.15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="41.959883" y="257.762594" transform="rotate(-0 41.959883 257.762594)">Illustrative, with u(w) = √w and W = 121.  Panel A: a loss of 96 occurs with probability 1/2, and a mitigation outlay of 40 cancels it.  Without information the agent always mitigates (EU = 9 rather than 8).  Panel B: the same preferences and loss, no mitigation, and a fair risk-neutral insurer.  The two panels are different decision problems; what is to be compared is the sign of the value of information.</text>
  </g>
