  <g id="text_31">
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="31.924598" y="257.762594" transform="rotate(-0 31.924598 257.762594)">Illustrative transition rule, with the claim probabilities of Section 3.7.  The stationary distributions are exact for this three-class chain:  (1/3, 1/3, 1/3) if a = 0, and  (16/21, 4/21, 1/21) if a = 1.</text>
