   <g id="text_27">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(403.841571 62.437653)">High prevention puts most of the</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(403.841571 70.23943)">mass in the best class, so the</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(403.841571 78.041208)">future premium is an incentive</text>
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(403.841571 85.842985)">instrument for today's action.</text>
   </g>
   <g id="text_28">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e1e1e" x="281.83076" y="12.598594" transform="rotate(-0 281.83076 12.598594)">B.  Stationary distribution, by prevention</text>
   </g>
