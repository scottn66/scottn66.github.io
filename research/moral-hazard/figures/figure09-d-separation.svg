   <g id="text_1">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(86.277733 156.721296)">Type is a common cause.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(55.112733 164.403046)">Chosen coverage and claims are associated.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(53.061233 172.084796)">That association is not a test of moral hazard.</text>
   </g>
