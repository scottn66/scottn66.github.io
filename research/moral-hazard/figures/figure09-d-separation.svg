   <g id="text_19">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(312.898267 365.242377)">do(coverage) leaves the causal path intact.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(317.584767 372.924127)">Coverage and claims remain associated.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(308.164267 380.605877)">That remaining association is the RAND result.</text>
   </g>
