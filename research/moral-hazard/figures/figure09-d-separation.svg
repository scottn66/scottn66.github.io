   <g id="text_7">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(302.703767 156.721296)">Random assignment cuts the edge into coverage.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(312.557767 164.403046)">If this is the only path, coverage and claims</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(299.399267 172.084796)">are then independent.  (RAND would find no effect.)</text>
   </g>
