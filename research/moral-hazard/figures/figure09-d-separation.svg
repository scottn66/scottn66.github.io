  <g id="text_24">
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #555555" x="21.312" y="433.18388" transform="rotate(-0 21.312 433.18388)">Schematic subgraphs of Figure 8.  A dashed arrow is an edge that the intervention has cut.  The Chiappori–Salanié positive-correlation test is a test of some remaining path in A or C, not of one graph against the other.  RAND is a version of the right-hand column.</text>
