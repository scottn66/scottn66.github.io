   <g id="text_13">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(34.156233 365.242377)">Coverage causes use or prevention, which causes claims.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(47.087733 372.924127)">The same raw association now has a causal path.</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(48.522733 380.605877)">Observationally, it still looks like the left column.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1e1e1e" x="5.76" y="220.891722" transform="rotate(-0 5.76 220.891722)">C.  Moral hazard (a causal path),  coverage chosen</text>
   </g>
   <g id="text_15">
