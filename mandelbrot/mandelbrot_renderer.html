<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandelbrot Explorer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="mandelbrotCanvas"></canvas>
  <script src="mandelbrot.js"></script>
  <script>
    // Wait for the DOM to load
    window.onload = function() {
      const canvas = document.getElementById("mandelbrotCanvas");
      // Optional: Set canvas dimensions, for example:
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Create a new Mandelbrot instance with the desired number of workers.
      // Ensure the path to worker.js is correct relative to index.html.
      const mandelbrot = new Mandelbrot(canvas, 4);
      
      // Start the initial render.
      mandelbrot.redraw();
    };
  </script>
</body>
</html>
