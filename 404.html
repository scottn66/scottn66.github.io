<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Scott Nelson</title>
  <meta name="description" content="That address is not on Scott Nelson's site. The portfolio and the solar warehouse are linked from the homepage.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Open+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2C3E50;
      --bg-color: #ffffff;
      --text-color: #333333;
      --section-bg: #f4f4f4;
      --navbar-bg: #343a40;
      --footer-bg: #333333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Open Sans", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }
    a { color: var(--primary-color); }
    a:focus-visible {
      outline: 2px solid #F5C451;
      outline-offset: 3px;
    }
    .navbar {
      background: var(--navbar-bg);
      padding: 1rem 1.25rem;
    }
    .navbar a {
      color: #ffffff;
      font-family: Montserrat, sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      text-decoration: none;
    }
    main {
      flex: 1;
      background: var(--section-bg);
      padding: 4.5rem 1.25rem 5rem;
    }
    .panel {
      max-width: 40rem;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-family: Montserrat, sans-serif;
      font-size: 2.5rem;
      color: var(--primary-color);
    }
    p { margin: 0 0 1.5rem; font-size: 1.125rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .actions a {
      display: inline-block;
      background: var(--primary-color);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.65rem 1rem;
      border-radius: 4px;
    }
    .actions a:hover { background: #1a2836; }
    footer {
      background: var(--footer-bg);
      color: #eeeeee;
      text-align: center;
      padding: 1.25rem;
    }
    footer a { color: #ffffff; }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Site">
    <a href="/">Scott Nelson</a>
  </nav>
  <main>
    <div class="panel">
      <h1>Page not found</h1>
      <p>That address is not on this site. The data-engineering work, including the solar warehouse, starts on the homepage.</p>
      <div class="actions">
        <a href="/">Home</a>
        <a href="/solar/">Solar viability</a>
        <a href="/resume.html">Resume</a>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 Scott Nelson</p>
  </footer>
</body>
</html>
